version: "2"
linters:
  default: all
  disable:
    - nlreturn # wsl_v5 is good enough.
    - wsl # deprecated.
    - exhaustruct # deprecated.
    - exhaustruct_v5 # Config and http.Client are filled a field at a time.
    - gomodguard # deprecated.
    - depguard # not useful.
    - tagliatelle # NZBGet JSON is not Go case.
    - tagalign # alignment noise on the API structs.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
